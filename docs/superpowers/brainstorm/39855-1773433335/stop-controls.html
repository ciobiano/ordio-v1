<h2>Recording → Stop: Bottom Bar Transformation</h2>
<p class="subtitle">The bar morphs in place — no dialog needed. Orb goes still above.</p>

<div style="display:flex; flex-direction:column; gap:40px; margin-top:32px;">

  <!-- BEFORE: Recording state -->
  <div>
    <p class="label" style="margin-bottom:12px;">During Recording</p>
    <div style="background:#000; border-radius:16px; overflow:hidden; max-width:390px; margin:0 auto; position:relative;">
      <!-- Orb area -->
      <div style="height:320px; display:flex; align-items:center; justify-content:center;">
        <div style="position:relative; width:140px; height:140px;">
          <div style="position:absolute; inset:-24px; border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,0.25) 0%, transparent 70%); animation: pulseGlow 3s ease-in-out infinite;"></div>
          <div style="width:140px; height:140px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #c4b5fd, #8b5cf6 45%, #6d28d9); box-shadow:0 0 60px rgba(139,92,246,0.4); animation: pulseC 3s ease-in-out infinite;"></div>
        </div>
      </div>
      <!-- Timer -->
      <div style="text-align:center; padding-bottom:16px;">
        <span style="font-family:monospace; font-size:14px; color:rgba(255,255,255,0.5); letter-spacing:1px;">01:23</span>
      </div>
      <!-- Bottom bar: 3 buttons -->
      <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 32px 32px;">
        <!-- Pause -->
        <div style="width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; cursor:pointer;">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="2" width="4" height="14" rx="1" fill="rgba(255,255,255,0.8)"/><rect x="11" y="2" width="4" height="14" rx="1" fill="rgba(255,255,255,0.8)"/></svg>
        </div>
        <!-- Stop -->
        <div style="width:64px; height:64px; border-radius:50%; background:rgba(225,29,72,0.15); border:2px solid rgba(225,29,72,0.6); display:flex; align-items:center; justify-content:center; cursor:pointer;">
          <div style="width:22px; height:22px; border-radius:4px; background:#e11d48;"></div>
        </div>
        <!-- Settings -->
        <div style="width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; cursor:pointer;">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M3.4 3.4l1.4 1.4M15.2 15.2l1.4 1.4M3.4 16.6l1.4-1.4M15.2 4.8l1.4-1.4" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Arrow -->
  <div style="text-align:center; color:rgba(255,255,255,0.3); font-size:24px;">↓ Stop pressed ↓</div>

  <!-- AFTER: Stopped state — bar transforms -->
  <div>
    <p class="label" style="margin-bottom:12px;">After Stop — Bar Transforms</p>
    <div style="background:#000; border-radius:16px; overflow:hidden; max-width:390px; margin:0 auto; position:relative;">
      <!-- Orb area — still, no animation -->
      <div style="height:320px; display:flex; align-items:center; justify-content:center;">
        <div style="position:relative; width:140px; height:140px;">
          <div style="position:absolute; inset:-24px; border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,0.12) 0%, transparent 70%);"></div>
          <div style="width:140px; height:140px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #a78bfa, #7c3aed 45%, #5b21b6); box-shadow:0 0 30px rgba(139,92,246,0.2); opacity:0.7;"></div>
        </div>
      </div>
      <!-- Duration label -->
      <div style="text-align:center; padding-bottom:8px;">
        <span style="font-family:monospace; font-size:14px; color:rgba(255,255,255,0.5); letter-spacing:1px;">01:23 recorded</span>
      </div>
      <!-- Transformed bottom bar -->
      <div style="padding:16px 24px 32px; display:flex; flex-direction:column; align-items:center; gap:12px;">
        <!-- Primary CTA: Proceed -->
        <button style="width:100%; max-width:320px; padding:14px 0; border-radius:12px; background:#fff; color:#000; font-size:15px; font-weight:600; border:none; cursor:pointer; letter-spacing:-0.2px;">
          Proceed
        </button>
        <!-- Secondary row: Resume + Restart -->
        <div style="display:flex; align-items:center; gap:24px;">
          <!-- Resume -->
          <button style="display:flex; align-items:center; gap:6px; background:none; border:none; color:rgba(255,255,255,0.6); font-size:13px; cursor:pointer; padding:8px 12px; border-radius:8px;">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polygon points="3,1 12,7 3,13" fill="rgba(255,255,255,0.6)"/></svg>
            Resume
          </button>
          <!-- Divider dot -->
          <div style="width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,0.2);"></div>
          <!-- Restart -->
          <button style="display:flex; align-items:center; gap:6px; background:none; border:none; color:rgba(255,255,255,0.35); font-size:13px; cursor:pointer; padding:8px 12px; border-radius:8px;">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7a5 5 0 1 1 1 3" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/><polyline points="2,5 2,7.5 4.5,7.5" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Restart
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

<style>
  @keyframes pulseC {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }
</style>
